name: CI/CD API

on:
  push:
  pull_request:

env:
  PROJECT_NAME: odh-tourism-api
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}-api
  DOCKER_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    - name: REUSE Compliance Check
      uses: fsfe/reuse-action@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
    - name: Restore dependencies
      run: dotnet restore OdhApiCore.sln
    - name: Build OdhApiCore Solution
      run: dotnet build OdhApiCore.sln --no-restore
    - name: Test
      run: dotnet test OdhApiCore --filter Category!=Integration

  # Deploy Test (Kubernetes / EKS)
  deploy-test-api:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: test
    concurrency: deploy-test-api
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Setup config
        run: |
            echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_NOICOMMUNITY }}" > google-service-account.noicommunity.json
            chmod +r google-service-account.noicommunity.json

      - name: Build and push
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}
          working-directory: OdhApiCore
          docker-compose-file: docker-compose.yml

      # https://github.com/shrink/actions-docker-registry-tag
      - name: Add an "unstable" docker tag
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ github.event.repository.name }}-api
          target: ${{ env.DOCKER_TAG }}
          tags: |
            unstable

      - name: Customize test.yaml
        run: |
          yq -i '.image.repository="${{ env.DOCKER_IMAGE }}"' infrastructure/helm/test.yaml
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/test.yaml
          yq -i '.image.pullPolicy="IfNotPresent"' infrastructure/helm/test.yaml

          yq -i '.envSecret.ASPNETCORE_ConnectionStrings__PgConnection="${{ secrets.PG_CONNECTION_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_MssConfig__Username="${{ secrets.MSS_USER_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_MssConfig__Password="${{ secrets.MSS_PSWD_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LcsConfig__Username="${{ secrets.LCS_USER_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LcsConfig__Password="${{ secrets.LCS_PSWD_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LcsConfig__MessagePassword="${{ secrets.LCS_MSGPSWD_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_SiagConfig__Username="${{ secrets.SIAG_USER_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_SiagConfig__Password="${{ secrets.SIAG_PSWD_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_S3ImageresizerConfig__BucketAccessPoint="${{ secrets.S3_BUCKET_ACCESSPOINT_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_S3ImageresizerConfig__AccessKey="${{ secrets.S3_IMAGEUPLOADER_ACCESSKEY_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_S3ImageresizerConfig__SecretKey="${{ secrets.S3_IMAGEUPLOADER_SECRETKEY_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_ElasticSearchConfig__ElasticUrl="${{ secrets.ELK_URL_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_ElasticSearchConfig__ElasticAuthtoken="${{ secrets.ELK_TOKEN_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_RavenConfig__Username="${{ secrets.RAVEN_USER_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_RavenConfig__Password="${{ secrets.RAVEN_PSWD_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_FCMConfig__noi-communityapp__ServerKey"]="${{ secrets.NOICOMMUNITY_SERVERKEY_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_FCMConfig__noi-communityapp__SenderId"]="${{ secrets.NOICOMMUNITY_SENDERID_TEST }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Url"]="${{ secrets.IDM_MARKETPLACE_PUSH_DEV_URL }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__User"]="${{ secrets.IDM_MARKETPLACE_PUSH_DEV_USERNAME }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Password"]="${{ secrets.IDM_MARKETPLACE_PUSH_DEV_PASSWORD }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Header"]="${{ secrets.IDM_MARKETPLACE_PUSH_DEV_HEADER }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Token"]="${{ secrets.IDM_MARKETPLACE_PUSH_DEV_TOKEN }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_S3Config__dc-meteorology-province-forecast__AccessKey"]="${{ secrets.S3_WEATHERFORECAST_ACCESSKEY }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret["ASPNETCORE_S3Config__dc-meteorology-province-forecast__AccessSecretKey"]="${{ secrets.S3_WEATHERFORECAST_SECRET }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiIDM__Username="${{ secrets.LTSAPI_IDM_USERNAME }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiIDM__Password="${{ secrets.LTSAPI_IDM_PASSWORD }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiIDM__XLSClientid="${{ secrets.LTSAPI_IDM_XLTSCLIENTID }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiOpen__Username="${{ secrets.LTSAPI_NOI_USERNAME }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiOpen__Password="${{ secrets.LTSAPI_NOI_PASSWORD }}"' infrastructure/helm/test.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiOpen__XLSClientid="${{ secrets.LTSAPI_IDM_XLTSCLIENTID }}"' infrastructure/helm/test.yaml

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v3
        with:
          k8s-name: tourism-api
          k8s-namespace: core
          chart-path: infrastructure/helm/tourism-api
          values-file: infrastructure/helm/test.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1

  deploy-prod-api:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/prod'
    needs: test
    environment: prod
    concurrency: deploy-prod-api
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Setup config
        run: |
            echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_NOICOMMUNITY }}" > google-service-account.noicommunity.json
            chmod +r google-service-account.noicommunity.json

      - name: Build and push
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}
          working-directory: OdhApiCore
          docker-compose-file: docker-compose.yml

      # https://github.com/shrink/actions-docker-registry-tag
      - name: Add a "latest" docker tag
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ github.event.repository.name }}-api
          target: ${{ env.DOCKER_TAG }}
          tags: |
            latest

      - name: Customize prod.yaml
        run: |
          yq -i '.image.repository="${{ env.DOCKER_IMAGE }}"' infrastructure/helm/prod.yaml
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/prod.yaml
          yq -i '.image.pullPolicy="IfNotPresent"' infrastructure/helm/prod.yaml

          yq -i '.envSecret.ASPNETCORE_ConnectionStrings__PgConnection="${{ secrets.PG_CONNECTION_PROD }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_MssConfig__Username="${{ secrets.MSS_USER_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_MssConfig__Password="${{ secrets.MSS_PSWD_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LcsConfig__Username="${{ secrets.LCS_USER_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LcsConfig__Password="${{ secrets.LCS_PSWD_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LcsConfig__MessagePassword="${{ secrets.LCS_MSGPSWD_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_SiagConfig__Username="${{ secrets.SIAG_USER_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_SiagConfig__Password="${{ secrets.SIAG_PSWD_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_S3ImageresizerConfig__BucketAccessPoint="${{ secrets.S3_BUCKET_ACCESSPOINT_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_S3ImageresizerConfig__AccessKey="${{ secrets.S3_IMAGEUPLOADER_ACCESSKEY_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_S3ImageresizerConfig__SecretKey="${{ secrets.S3_IMAGEUPLOADER_SECRETKEY_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_ElasticSearchConfig__ElasticUrl="${{ secrets.ELK_URL_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_ElasticSearchConfig__ElasticAuthtoken="${{ secrets.ELK_TOKEN_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_RavenConfig__Username="${{ secrets.RAVEN_USER_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_RavenConfig__Password="${{ secrets.RAVEN_PSWD_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_FCMConfig__noi-communityapp__ServerKey"]="${{ secrets.NOICOMMUNITY_SERVERKEY_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_FCMConfig__noi-communityapp__SenderId"]="${{ secrets.NOICOMMUNITY_SENDERID_TEST }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Url"]="${{ secrets.IDM_MARKETPLACE_PUSH_PROD_URL }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__User"]="${{ secrets.IDM_MARKETPLACE_PUSH_PROD_USERNAME }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Password"]="${{ secrets.IDM_MARKETPLACE_PUSH_PROD_PASSWORD }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Header"]="${{ secrets.IDM_MARKETPLACE_PUSH_PROD_HEADER }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_NotifierConfig__idm-marketplace__Token"]="${{ secrets.IDM_MARKETPLACE_PUSH_PROD_TOKEN }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_S3Config__dc-meteorology-province-forecast__AccessKey"]="${{ secrets.S3_WEATHERFORECAST_ACCESSKEY }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret["ASPNETCORE_S3Config__dc-meteorology-province-forecast__AccessSecretKey"]="${{ secrets.S3_WEATHERFORECAST_SECRET }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiIDM__Username="${{ secrets.LTSAPI_IDM_USERNAME }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiIDM__Password="${{ secrets.LTSAPI_IDM_PASSWORD }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiIDM__XLSClientid="${{ secrets.LTSAPI_IDM_XLTSCLIENTID }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiOpen__Username="${{ secrets.LTSAPI_NOI_USERNAME }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiOpen__Password="${{ secrets.LTSAPI_NOI_PASSWORD }}"' infrastructure/helm/prod.yaml
          yq -i '.envSecret.ASPNETCORE_LTSApiOpen__XLSClientid="${{ secrets.LTSAPI_IDM_XLTSCLIENTID }}"' infrastructure/helm/prod.yaml

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v3
        with:
          k8s-name: tourism-api
          k8s-namespace: core
          chart-path: infrastructure/helm/tourism-api
          values-file: infrastructure/helm/prod.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1

