name: CI/CD Importer

on:
  push:
    paths:
      - "OdhApiImporter/**"
      - "DataModel/**"
      - "DSS/**"
      - "CDB/**"
      - "MOMENTUS/**"
      - "LCS/**"
      - "MSS/**"
      - "NINJA/**"
      - "RAVEN/**"
      - "SIAG/**"
      - "STA/**"
      - "LOOPTEC/**"
      - "FERATEL/**"
      - "PANOMAX/**"
      - "PANOCLOUD/**"
      - "A22/**"     
      - "DIGIWAY/**"
      - "SuedtirolWein/**"
      - "Helper/**"
      - "OdhNotifier/**"
      - ".github/workflows/main_importer.yml"
      - "infrastructure/docker-compose.run.yml"
  pull_request:
    paths:
      - "OdhApiImporter/**"
      - "DataModel/**"
      - ".github/workflows/main_importer.yml"

env:
  PROJECT_NAME: odh-tourism-importer
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}-importer
  DOCKER_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    
    - name: REUSE Compliance Check
      uses: fsfe/reuse-action@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'        
    - name: Restore dependencies
      run: dotnet restore OdhApiCore.sln
    - name: Build OdhApiCore Solution
      run: dotnet build OdhApiCore.sln --no-restore

  # Deploy Test (Kubernetes / EKS)
  deploy-test-importer:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: test
    concurrency: deploy-test-importer
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Build and push
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}
          working-directory: OdhApiImporter
          docker-compose-file: docker-compose.yml

      - name: Customize test.yaml
        run: |
          yq -i '.image.repository="${{ env.DOCKER_IMAGE }}"' infrastructure/helm/tourism-importer-test.yaml
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/tourism-importer-test.yaml
          yq -i '.image.pullPolicy="IfNotPresent"' infrastructure/helm/tourism-importer-test.yaml

          yq -i '.envSecret.ASPNETCORE_ConnectionStrings__PgConnection="${{ secrets.PG_CONNECTION_TEST }}"' infrastructure/helm/tourism-importer-test.yaml
