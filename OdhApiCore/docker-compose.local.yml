name: content-api
services:
  api:
    build:
      context: ../
      dockerfile: OdhApiCore/Dockerfile.local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
    env_file:
      # Solution-wide shared values first, then this project's own values on
      # top (overriding any shared key). Both files are gitignored - copy
      # them from the matching .env.example before running `docker compose up`.
      - ../.env
      - .env
    ports:
      - "8083:80"

  # The database service for the 'dev' profile.
  db:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: postgres
    volumes:
      - ../.dev/content-api-db-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    profiles:
      - dev